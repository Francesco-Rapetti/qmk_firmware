name: Release Firmware

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  KEYMAP: Francesco-Rapetti

jobs:
  build:
    name: "Compile ${{ matrix.keyboard }}"
    # Toolchain and Python deps pinned to match the 2024 QMK base of this fork:
    # the ghcr.io/qmk/qmk_cli:latest container is too new for it
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: nuphy/air75_v2/ansi
            artifact: air75_v2
          - keyboard: nuphy/gem80/ansi
            artifact: gem80
          - keyboard: nuphy/kick75/ansi
            artifact: kick75

    steps:
      - name: Checkout QMK Firmware
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          python3 -m pip install "qmk==1.1.5" "milc>=1.6.8,<1.9" -r requirements.txt
          arm-none-eabi-gcc --version | head -n 1

      - name: Compile firmware
        shell: bash
        run: |
          if ! qmk compile -kb ${{ matrix.keyboard }} -km ${{ env.KEYMAP }} > build.log 2>&1; then
            cat build.log
            # Job logs need a GitHub login, annotations don't: show the tail of the error on the run page
            msg=$(tail -n 40 build.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compile ${{ matrix.keyboard }} failed::$msg"
            exit 1
          fi
          cat build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.artifact }}
          path: "*.bin"
          if-no-files-found: error

  release:
    name: "Publish release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download firmwares
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Create release or attach firmwares
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l firmware
          # A release created from the GitHub UI already exists: keep its notes and just attach the binaries
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" firmware/*.bin --clobber
          else
            gh release create "$TAG" firmware/*.bin \
              --title "Nuphy custom firmware ${TAG#v}" \
              --generate-notes
          fi
